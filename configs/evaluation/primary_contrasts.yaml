schema_version: 1
bootstrap_samples: 10000
seed: 17
metrics:
  - student_feasibility_mean
  - student_soundness_mean
descriptive_metrics:
  - student_quality_mean
  - student_relevance_mean
  - student_feasibility_mean
  - student_soundness_mean
  - student_clarity_mean
  - student_instruction_compliance_mean
  - teacher_mode_recall
  - teacher_mode_precision
  - cluster_jsd
  - quality_adjusted_coverage
  - quality_qualified_semantic_yield
  - nearest_training_target_similarity_mean
  - length_stop_rate
  - completion_tokens_mean
threshold_metric_directions:
  student_semantic_clusters: higher
  teacher_mode_recall: higher
  teacher_mode_precision: higher
  cluster_jsd: lower
  quality_adjusted_coverage: higher
  quality_qualified_semantic_yield: higher
contrasts:
  - {id: B3-vs-B2a, reference: B2a, treatment: B3}
  - {id: B3-vs-B2b, reference: B2b, treatment: B3}
  - {id: B3-vs-B2c, reference: B2c, treatment: B3}
  - {id: B4-vs-B3, reference: B3, treatment: B4}
  - {id: C2-best1-vs-C1-best1, reference: C1-best1, treatment: C2-best1}
  - {id: C2-diverse4-vs-C1-diverse4, reference: C1-diverse4, treatment: C2-diverse4}
  - {id: D2-vs-D1, reference: D1, treatment: D2}
  - {id: D3-vs-D1, reference: D1, treatment: D3}
  - {id: C3-vs-C1-best1, reference: C1-best1, treatment: C3}
  - {id: B3-vs-A0, reference: A0, treatment: B3}
  - {id: D1-vs-A0, reference: A0, treatment: D1}
